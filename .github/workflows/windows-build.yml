name: Windows build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'AGENTS.md', 'README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read application version
        id: metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/SnailCommander/SnailCommander.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid application version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run deterministic regression suite
        shell: pwsh
        run: |
          dotnet run --project tests/SnailCommander.Tests/SnailCommander.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows x64 application and updater
        shell: pwsh
        run: |
          $version = '${{ steps.metadata.outputs.version }}'
          $revision = $env:GITHUB_SHA
          dotnet publish src/SnailCommander/SnailCommander.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:InformationalVersion=$version+$revision" -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/SnailCommander.Updater/SnailCommander.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item updater-publish/SnailCommander.Updater.exe publish/SnailCommander.Updater.exe
          if (!(Test-Path publish/SnailCommander.exe) -or !(Test-Path publish/SnailCommander.Updater.exe)) { throw "Missing updater or app executable." }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SnailCommander-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: snailcommander-public-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download compiled Windows build
        uses: actions/download-artifact@v4
        with:
          name: SnailCommander-win-x64
          path: publish
      - name: Package and publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/SnailCommander.exe
          test -f publish/SnailCommander.Updater.exe
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping obsolete build; main has advanced to $head_sha."
            exit 0
          fi
          cd publish
          zip -q -r ../SnailCommander-win-x64.zip .
          cd ..
          sha256sum SnailCommander-win-x64.zip > SHA256SUMS.txt
          printf 'Snail Commander v%s, commit %s. Self-contained Windows x64 build; public token-free updates.\n\n' "$APP_VERSION" "$GITHUB_SHA" > release-notes.md
          awk 'BEGIN { active=0 } /^## / { if (active) exit; active=1 } active { print }' CHANGELOG.md >> release-notes.md
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "SnailCommander-win-x64.zip" "SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Snail Commander v${APP_VERSION} (build ${GITHUB_SHA:0:10})" \
              --notes-file release-notes.md --latest=false
          else
            # Repair partial release uploads from an interrupted attempt before any Latest promotion.
            gh release upload "$tag" "SnailCommander-win-x64.zip" "SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Snail Commander v${APP_VERSION} (build ${GITHUB_SHA:0:10})" --notes-file release-notes.md
          fi
          # Recheck immediately before promotion. Reruns of older commits cannot replace Latest.
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          fi
